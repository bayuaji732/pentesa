name: pentesa-prod

services:
  # ---------------------------------------------------------------------------
  # 1. Pentesa Core API Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: pentesa-api
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PENTESA_ENV=production
      - PENTESA_DEBUG=false
      - PENTESA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pentesa_user}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pentesa}
      - PENTESA_REDIS_URL=redis://redis:6379/0
      - PENTESA_SECRET_KEY=${JWT_SECRET:-${PENTESA_SECRET_KEY:?}}
      - PENTESA_ENCRYPTION_KEY=${PENTESA_ENCRYPTION_KEY:-${PENTESA_MASTER_KEY:?}}
      - PENTESA_LLM_PROVIDER=${PENTESA_LLM_PROVIDER:-litellm}
      - PENTESA_REPORT_STORAGE_DIR=/app/data/reports
      - PENTESA_EVIDENCE_STORAGE_DIR=/app/data/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pentesa-reports:/app/data/reports
      - pentesa-evidence:/app/data/evidence
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pentesa-internal

  # ---------------------------------------------------------------------------
  # 2. Pentesa Asynchronous Security Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: pentesa-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PENTESA_ENV=production
      - PENTESA_DEBUG=false
      - PENTESA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pentesa_user}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pentesa}
      - PENTESA_REDIS_URL=redis://redis:6379/0
      - PENTESA_SECRET_KEY=${JWT_SECRET:-${PENTESA_SECRET_KEY:?}}
      - PENTESA_ENCRYPTION_KEY=${PENTESA_ENCRYPTION_KEY:-${PENTESA_MASTER_KEY:?}}
      - PENTESA_LLM_PROVIDER=${PENTESA_LLM_PROVIDER:-litellm}
      - PENTESA_REPORT_STORAGE_DIR=/app/data/reports
      - PENTESA_EVIDENCE_STORAGE_DIR=/app/data/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pentesa-reports:/app/data/reports
      - pentesa-evidence:/app/data/evidence
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pentesa-internal

  # ---------------------------------------------------------------------------
  # 3. Pentesa SOC Web Console (Next.js 14)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_INTERNAL_URL: http://api:8000
    container_name: pentesa-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pentesa-internal

  # ---------------------------------------------------------------------------
  # 4. PostgreSQL 16 Relational Store
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pentesa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentesa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-pentesa}
    volumes:
      - pentesa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentesa_user} -d ${POSTGRES_DB:-pentesa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pentesa-internal

  # ---------------------------------------------------------------------------
  # 5. Redis Task Broker & State Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pentesa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - pentesa-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pentesa-internal

volumes:
  pentesa-pgdata:
  pentesa-redisdata:
  pentesa-reports:
  pentesa-evidence:

networks:
  pentesa-internal:
    name: pentesa-internal
    driver: bridge
