# Pentesa Benchmark Environment — Isolated Benchmark Target Topology
# PENTESA-BENCH-COMPOSE-V1.0
#
# NETWORK ISOLATION INVARIANT:
# All target applications sit strictly on `pentesa-bench-net` configured with `internal: true`.
# Outbound traffic from targets to the internet is completely blocked at the Docker engine level.
#
# IMPORTANT NOTICE ON SCANNER EGRESS & NI-03:
# The Pentesa API and Worker containers must also attach to an egress bridge network to communicate
# with the enterprise AI gateway (Azure OpenAI / LiteLLM Proxy). Therefore, Docker-level network
# isolation does NOT constrain the scanner containers themselves; the fail-closed application-level
# lab-only guardrail (FIX-08) is the primary barrier preventing tool subprocesses (nuclei, ffuf)
# from contacting unauthorized hosts until the dedicated Layer-2 egress proxy (NI-03) is built in Phase 9.
# ONLY targets defined in this file are authorized to be scanned.

name: pentesa-bench

services:
  # ============================================================================
  # TARGET 1: OWASP Juice Shop (Modern NodeJS / Express / Angular SPA)
  # ============================================================================
  target-juiceshop:
    image: bkimminich/juice-shop:latest@sha256:877fc77b12d72b42e486eb09b6b1711cc56514306d92006b284e7e7cf076a809
    container_name: bench-juiceshop
    restart: unless-stopped
    environment:
      - NODE_ENV=unsafe
    networks:
      - pentesa-bench-net
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/rest/admin/application-version', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TARGET 2: Damn Vulnerable Web Application (DVWA - PHP / Apache / MySQL)
  # Provides both vulnerable and "impossible" (secure) benchmark baselines.
  # ============================================================================
  target-dvwa:
    image: vulnerables/web-dvwa:latest@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    container_name: bench-dvwa
    restart: unless-stopped
    environment:
      - PHP_IDE_CONFIG=serverName=dvwa
    networks:
      - pentesa-bench-net
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(strpos(file_get_contents('http://127.0.0.1/login.php'), 'login') !== false ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TARGET 3: OWASP WebGoat (Java / Spring Boot Enterprise Application)
  # ============================================================================
  target-webgoat:
    image: webgoat/webgoat:v2023.8@sha256:01672eb9aeba60d042ae1131d6de683b98fa64e9da60fa5d3daad2642a6795dd
    container_name: bench-webgoat
    restart: unless-stopped
    environment:
      - WEBRUN_PORT=8080
      - WEBGOAT_PORT=8080
      - WEBWOLF_PORT=9090
    networks:
      - pentesa-bench-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/WebGoat/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TARGET 4: crAPI (Completely Ridiculous API - Microservices BOLA/IDOR Target)
  # ============================================================================
  crapi-web:
    image: crapi/crapi-web:latest@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    container_name: bench-crapi-web
    restart: unless-stopped
    environment:
      - HTTP_PROTOCOL=http
      - COMMUNITY_SERVICE=crapi-community:8087
      - IDENTITY_SERVICE=crapi-identity:8080
      - WORKSHOP_SERVICE=crapi-workshop:8000
      - MAILHOG_WEB_SERVICE=crapi-mailhog:8025
      - CHATBOT_SERVICE=crapi-web:80
    depends_on:
      - crapi-identity
      - crapi-community
      - crapi-workshop
    networks:
      - pentesa-bench-net

  crapi-identity:
    image: crapi/crapi-identity:latest@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
    container_name: bench-crapi-identity
    restart: unless-stopped
    environment:
      - DB_HOST=crapi-db
      - DB_PORT=5432
      - DB_NAME=crapi
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - SERVER_PORT=8080
      - JWT_SECRET=crapi_jwt_secret_key_2026
      - 
      - SMTP_FROM=no-reply@example.com
      - SMTP_AUTH=false
      - SMTP_HOST=crapi-mailhog
      - SMTP_PORT=1025
      - SMTP_EMAIL=no-reply@example.com
      - SMTP_PASS=password
      - SMTP_STARTTLS=false
      - MAILHOG_HOST=crapi-mailhog
      - MAILHOG_PORT=1025
      - MAILHOG_DOMAIN=crapi-mailhog
      - ENABLE_SHELL_INJECTION=true
      - API_GATEWAY_URL=http://crapi-web:80
      - TLS_ENABLED=false
    depends_on:
      - crapi-db
      - crapi-mailhog
    networks:
      - pentesa-bench-net

  crapi-community:
    image: crapi/crapi-community:latest@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    container_name: bench-crapi-community
    restart: unless-stopped
    environment:
      - DB_HOST=crapi-db
      - DB_PORT=5432
      - DB_NAME=crapi
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - SERVER_PORT=8087
      - MONGO_DB_HOST=crapi-mongodb
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=crapi
      - MONGO_DB_PASSWORD=crapi
      - IDENTITY_SERVICE=crapi-identity:8080
    depends_on:
      - crapi-db
      - crapi-mongodb
      - crapi-identity
    networks:
      - pentesa-bench-net

  crapi-workshop:
    image: crapi/crapi-workshop:latest@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
    container_name: bench-crapi-workshop
    restart: unless-stopped
    environment:
      - SECRET_KEY=crapi_django_secret_key_2026
      - API_GATEWAY_URL=http://crapi-web:80
      - DB_HOST=crapi-db
      - DB_PORT=5432
      - DB_NAME=crapi
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - SERVER_PORT=8000
      - MONGO_DB_NAME=crapi
      - MONGO_DB_HOST=crapi-mongodb
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=crapi
      - MONGO_DB_PASSWORD=crapi
      - IDENTITY_SERVICE=crapi-identity:8080
      - TLS_ENABLED=false
    depends_on:
      - crapi-db
      - crapi-mongodb
      - crapi-identity
    networks:
      - pentesa-bench-net

  crapi-db:
    image: postgres:14-alpine@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20
    container_name: bench-crapi-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=crapi
      - POSTGRES_USER=crapi
      - POSTGRES_PASSWORD=crapi
    networks:
      - pentesa-bench-net

  crapi-mongodb:
    image: mongo:4.4.18@sha256:d23ec07162ca06646a6329c452643f37494af644d045c002a7b41873981c160d
    container_name: bench-crapi-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=crapi
      - MONGO_INITDB_ROOT_PASSWORD=crapi
      - MONGO_INITDB_DATABASE=crapi
    networks:
      - pentesa-bench-net

  crapi-mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: bench-crapi-mailhog
    restart: unless-stopped
    networks:
      - pentesa-bench-net

  # ============================================================================
  # TARGET 5: Pentesa Bench (Purpose-Built Paired Vulnerable / Secure App)
  # Covers SSTI, XXE, Cmd Injection, File Upload, Path Traversal, SSRF, JWT, Race, Business Logic.
  # ============================================================================
  target-pentesa-bench:
    build:
      context: ./bench_app
      dockerfile: Dockerfile
    image: pentesa-bench:latest
    container_name: bench-pentesa-app
    restart: unless-stopped
    networks:
      - pentesa-bench-net
      - pentesa-canary-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # SENSOR: Internal Canary Trap (SSRF Sensor)
  # Isolated on pentesa-canary-net; reachable ONLY by bench-pentesa-app
  # ============================================================================
  bench-canary:
    build:
      context: ./canary
      dockerfile: Dockerfile
    image: pentesa-canary:latest
    container_name: bench-canary-sensor
    restart: unless-stopped
    networks:
      - pentesa-canary-net

networks:
  pentesa-bench-net:
    name: pentesa-bench-net
    internal: true
  pentesa-canary-net:
    name: pentesa-canary-net
    internal: true
