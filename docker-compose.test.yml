services:
  test-runner:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.test
    container_name: pentesa-test-runner
    environment:
      - PENTESA_ENV=test
      - PENTESA_LLM_PROVIDER=mock
      - PENTESA_ENCRYPTION_KEY=preflight_test_master_encryption_key_32b_hex!
      - TEST_DATABASE_URL=postgresql+asyncpg://pentesa_user:pentesa_password@db:5432/pentesa_test
    volumes:
      - .:/app
    networks:
      - test-isolated
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "tests/", "-v", "--tb=short"]

  db:
    image: postgres:16-alpine
    container_name: pentesa-test-db
    environment:
      POSTGRES_USER: pentesa_user
      POSTGRES_PASSWORD: pentesa_password
      POSTGRES_DB: pentesa_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentesa_user -d pentesa_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - test-isolated

  redis:
    image: redis:7-alpine
    container_name: pentesa-test-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - test-isolated

networks:
  test-isolated:
    name: test-isolated
    internal: true
