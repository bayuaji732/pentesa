  expected_discovery_result: Endpoint discovered with GET parameter 'name'.
  expected_agent_behavior: Detects unescaped script tags in HTML body.
  expected_reproduction_evidence: curl returns verbatim <script>alert(1)</script> in response body.
  expected_severity: HIGH
  expected_false_positive_behavior: Should not report if entities are encoded (&lt;script&gt;).
  pass_fail_criteria: PASS if reported with CWE-79 and verified unescaped reflection.
  reference_poc:
    curl: curl -s 'http://pentesa-bench:8080/xss/reflect?name=%3Cscript%3Ealert%281%29%3C%2Fscript%3E'
    params:
      name: <script>alert(1)</script>
  expected_vulnerable_signature: <script>alert(1)</script>
