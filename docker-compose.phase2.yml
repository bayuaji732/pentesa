services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Store
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pentesa-phase2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pentesa_user
      POSTGRES_PASSWORD: Phase2_Secure_DB_Pass_2026!
      POSTGRES_DB: pentesa
    volumes:
      - phase2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentesa_user -d pentesa"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - phase2-internal

  # ---------------------------------------------------------------------------
  # 2. Redis 7 Task Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pentesa-phase2-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - phase2-internal

  # ---------------------------------------------------------------------------
  # 3. Pentesa API Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: pentesa-phase2-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PENTESA_ENV=production
      - PENTESA_DEBUG=false
      - PENTESA_DATABASE_URL=postgresql+asyncpg://pentesa_user:Phase2_Secure_DB_Pass_2026!@db:5432/pentesa
      - PENTESA_REDIS_URL=redis://redis:6379/0
      - PENTESA_REPORT_STORAGE_DIR=/app/data/reports
      - PENTESA_EVIDENCE_STORAGE_DIR=/app/data/evidence
      - PENTESA_ENCRYPTION_KEY=phase2_master_vault_encryption_key_32b_hex!
      - PENTESA_SECRET_KEY=Phase2_JWT_Secret_Key_32_Bytes_Long_Prod_Ready!
      - PENTESA_BOOTSTRAP_ADMIN=true
      - PENTESA_BOOTSTRAP_ADMIN_EMAIL=security-lead@phase2.lab
      - PENTESA_BOOTSTRAP_ADMIN_PASSWORD=CyberSecOps_2026!Str0ng#Auth
      - PENTESA_LLM_PROVIDER=litellm
      - PENTESA_LITELLM_BASE_URL=https://uat-ai-gateway.siloamhospitals.com/v1/
      - PENTESA_LITELLM_API_KEY=sk-mCQwNXf15qH4UyLxLVGAQA
      - PENTESA_LITELLM_MODEL=azure/gpt-5.6-terra-dev-gtw
    volumes:
      - phase2-reports:/app/data/reports
      - phase2-evidence:/app/data/evidence
      - ./tests/fixtures/nuclei:/app/tests/fixtures/nuclei:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phase2-internal
      - phase2-targets

  # ---------------------------------------------------------------------------
  # 4. Pentesa Asynchronous Security Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: pentesa-phase2-worker
    restart: unless-stopped
    environment:
      - PENTESA_ENV=production
      - PENTESA_DEBUG=false
      - PENTESA_DATABASE_URL=postgresql+asyncpg://pentesa_user:Phase2_Secure_DB_Pass_2026!@db:5432/pentesa
      - PENTESA_REDIS_URL=redis://redis:6379/0
      - PENTESA_REPORT_STORAGE_DIR=/app/data/reports
      - PENTESA_EVIDENCE_STORAGE_DIR=/app/data/evidence
      - PENTESA_ENCRYPTION_KEY=phase2_master_vault_encryption_key_32b_hex!
      - PENTESA_SECRET_KEY=Phase2_JWT_Secret_Key_32_Bytes_Long_Prod_Ready!
      - PENTESA_BOOTSTRAP_ADMIN=true
      - PENTESA_BOOTSTRAP_ADMIN_EMAIL=security-lead@phase2.lab
      - PENTESA_BOOTSTRAP_ADMIN_PASSWORD=CyberSecOps_2026!Str0ng#Auth
      - PENTESA_LLM_PROVIDER=litellm
      - PENTESA_LITELLM_BASE_URL=https://uat-ai-gateway.siloamhospitals.com/v1/
      - PENTESA_LITELLM_API_KEY=sk-mCQwNXf15qH4UyLxLVGAQA
      - PENTESA_LITELLM_MODEL=azure/gpt-5.6-terra-dev-gtw
    volumes:
      - phase2-reports:/app/data/reports
      - phase2-evidence:/app/data/evidence
      - ./tests/fixtures/nuclei:/app/tests/fixtures/nuclei:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - phase2-internal
      - phase2-targets

  # ---------------------------------------------------------------------------
  # 5. Pentesa SOC Web Console (Next.js 14)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        API_INTERNAL_URL: http://api:8000
    container_name: pentesa-phase2-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - phase2-internal

  # ---------------------------------------------------------------------------
  # 6. Authorized Pentest Target: OWASP Juice Shop
  # ---------------------------------------------------------------------------
  target-juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: pentesa-phase2-target
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      phase2-targets:
        aliases:
          - target-juiceshop

  # ---------------------------------------------------------------------------
  # 7. Out-of-Scope Target: Canary Logger (Must receive 0 requests)
  # ---------------------------------------------------------------------------
  canary:
    image: python:3.12-slim-bookworm
    container_name: pentesa-phase2-canary
    restart: unless-stopped
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ./scripts/canary_server.py:/app/canary_server.py:ro
      - phase2-evidence:/app/data
    command: ["python", "/app/canary_server.py", "9099"]
    networks:
      phase2-targets:
        aliases:
          - canary

  # ---------------------------------------------------------------------------
  # 8. In-Scope Target: Redirector (302 redirects to Canary)
  # ---------------------------------------------------------------------------
  redirector:
    image: python:3.12-slim-bookworm
    container_name: pentesa-phase2-redirector
    restart: unless-stopped
    ports:
      - "127.0.0.1:9098:9098"
    environment:
      - CANARY_URL=http://canary:9099/canary-trap
    volumes:
      - ./scripts/redirector_server.py:/app/redirector_server.py:ro
    command: ["python", "/app/redirector_server.py", "9098"]
    depends_on:
      - canary
    networks:
      phase2-targets:
        aliases:
          - redirector

networks:
  phase2-internal:
    name: phase2-internal
    driver: bridge
  phase2-targets:
    name: phase2-targets
    driver: bridge
    internal: true

volumes:
  phase2-pgdata:
  phase2-reports:
  phase2-evidence:

