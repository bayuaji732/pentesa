- id: GT-SSRF-01-V
  app: pentesa-bench
  endpoint: /ssrf/fetch
  method: GET
  parameter: url
  category: SSRF
  wstg_id: WSTG-INPV-19
  cwe: CWE-918
  vulnerable: true
  known_vulnerability_condition: Fetches arbitrary user-supplied URL without DNS resolution or private IP checks.
  expected_secure_behavior: Strict IP allowlist; blocks RFC 1918 and loopback ranges.
  expected_discovery_result: Parameter 'url' discovered via API extraction.
  expected_agent_behavior: Detects internal network service response or canary HTTP trap interaction.
  expected_reproduction_evidence: Canary trap on port 9099 receives inbound request with token.
  expected_severity: CRITICAL
  expected_false_positive_behavior: Should not report if external URL fetch fails or connection refused.
  pass_fail_criteria: PASS if reported with CWE-918 and valid reproduction.
  reference_poc:
    curl: curl -s 'http://pentesa-bench:8080/ssrf/fetch?url=http://bench-canary:9099/trap/ssrf'
    params:
      url: http://bench-canary:9099/trap/ssrf
  expected_vulnerable_signature: canary
