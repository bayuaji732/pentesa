version: 2.0.0
benchmark_metadata:
  description: Pentesa Master Ground Truth Matrix (Expanded 3A-FIX Round)
  categories_covered: 15
  vulnerable_cases: 45
  secure_control_cases: 18
  total_cases: 63
  target_applications:
  - name: Pentesa Bench
    role: Primary Controlled Paired Vulnerable/Secure Microservice
  - name: OWASP Juice Shop
    role: Third-Party Modern SPA Target (Recall Only)
  - name: DVWA
    role: Third-Party Multi-tier PHP Target (Recall + Impossible Controls)
  - name: crAPI
    role: Third-Party Microservices REST API Target (Recall Only)
  - name: OWASP WebGoat
    role: Third-Party Enterprise Java Target (Recall Only)
cases:
- id: GT-SQLI-01-V
  app: pentesa-bench
  endpoint: /sqli/search
  method: GET
  parameter: q
  category: SQL Injection
  wstg_id: WSTG-INPV-05
  cwe: CWE-89
  vulnerable: true
  known_vulnerability_condition: 'Direct SQLite string interpolation: SELECT id, name, description, price FROM products WHERE
    name LIKE ''%{q}%''.'
  expected_secure_behavior: Input parameterized using prepared statement bindings.
  expected_discovery_result: GET parameter 'q' discovered via API discovery.
  expected_agent_behavior: VulnerabilityAgent detects anomalous response delta and database records returned on union/boolean
    payloads.
  expected_reproduction_evidence: HTTP GET with payload q=' OR 1=1-- returns hidden record FLAG{PENTESA_SQLI_INJECTION_VERIFIED_8b12}.
  expected_severity: HIGH
  expected_false_positive_behavior: Should not be reported if single quote returns clean 400 validation error without database
    leakage.
  pass_fail_criteria: PASS if reported with CWE-89, parameter 'q', and valid curl reproduction returning leaked database entities.
  reference_poc:
    curl: curl -s 'http://pentesa-bench:8080/sqli/search?q=%27+OR+1%3D1--'
    params:
      q: ''' OR 1=1--'
  expected_vulnerable_signature: FLAG{PENTESA_SQLI_INJECTION_VERIFIED_8b12}
- id: GT-SQLI-02-V
  app: juiceshop
