id: test-ping
info:
  name: Local Test Ping Endpoint
  author: pentesa
  severity: info
  description: Verifies basic HTTP reachability for scope-validated endpoints.
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: status
        status:
          - 200
          - 204
          - 301
          - 302
