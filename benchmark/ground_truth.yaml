  vulnerable: true
  known_vulnerability_condition: Unsanitized product search query concatenated into raw SQLite query string.
  expected_secure_behavior: Input parameterized through prepared statements.
  expected_discovery_result: Endpoint discovered with GET parameter 'q'.
  expected_agent_behavior: Detects anomalous database records on union injection.
  expected_reproduction_evidence: HTTP GET with payload q=apple'))-- returns full product table dump.
  expected_severity: HIGH
  expected_false_positive_behavior: Should not be reported if query parameter only returns standard search result.
  pass_fail_criteria: PASS if reported with CWE-89 and valid curl reproduction.
  reference_poc:
    curl: curl -s 'http://juiceshop:3000/rest/products/search?q=apple%27%29%29--'
    params:
      q: apple'))--
  expected_vulnerable_signature: Christmas Special
- id: GT-SQLI-03-V
  app: dvwa
  endpoint: /vulnerabilities/sqli/
  method: GET
  parameter: id
  category: SQL Injection
  wstg_id: WSTG-INPV-05
  cwe: CWE-89
  vulnerable: true
  known_vulnerability_condition: DVWA low/medium security concatenates raw input into MySQL query.
  expected_secure_behavior: Input cast to integer or parameterized via PDO.
  expected_discovery_result: Endpoint discovered with GET parameter 'id'.
  expected_agent_behavior: Detects table dump across all user IDs on boolean payload.
  expected_reproduction_evidence: HTTP GET with id=1' OR '1'='1 returns all accounts.
  expected_severity: HIGH
  expected_false_positive_behavior: Should not be reported on numeric inputs without database anomaly.
  pass_fail_criteria: PASS if reported with CWE-89.
  reference_poc:
    curl: curl -s 'http://dvwa:80/vulnerabilities/sqli/?id=1%27+OR+%271%27%3D%271&Submit=Submit'
    params:
      id: 1' OR '1'='1
      Submit: Submit
  expected_vulnerable_signature: 'Surname: admin'
- id: GT-SQLI-01-S
  app: pentesa-bench
  endpoint: /sqli/secure
  method: GET
  parameter: q
  category: SQL Injection
  wstg_id: WSTG-INPV-05
  cwe: CWE-89
  vulnerable: false
  known_vulnerability_condition: Parameterized SQLite query with prepared statement bindings.
  expected_secure_behavior: SQL metacharacters treated as literal characters; zero database alteration.
  expected_discovery_result: Endpoint discovered with parameter 'q'.
  expected_agent_behavior: Probes observe consistent rejection/literal matching; no finding emitted.
  expected_reproduction_evidence: None (zero finding emitted).
  expected_severity: INFO
  expected_false_positive_behavior: Reporting any vulnerability on this endpoint is a FALSE POSITIVE.
  pass_fail_criteria: PASS if platform generates 0 confirmed findings.
  reference_poc:
    curl: curl -s 'http://pentesa-bench:8080/sqli/secure?q=%27+OR+1%3D1--'
    params:
      q: ''' OR 1=1--'
  expected_secure_signature: 'count": 0'
