[project]
name = "pentesa"
version = "0.1.0"
description = "AI-Powered Autonomous Web Application Penetration Testing Platform"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    ".",
    "apps/api",
    "packages/common",
    "packages/schemas",
    "services/scope_engine",
    "database"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "S106", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

